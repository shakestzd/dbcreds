# mkdocs.yml
site_name: dbcreds
site_description: Professional Database Credentials Management
site_url: https://sunnova-shakesdlamini.github.io/dbcreds/
repo_url: https://github.com/Sunnova-ShakesDlamini/dbcreds
repo_name: Sunnova-ShakesDlamini/dbcreds
copyright: Copyright &copy; 2024 Sunnova ShakesDlamini

# Theme configuration
theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  
  # Color palette configuration
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    
    # Dark mode  
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  
  # Font configuration
  font:
    text: Inter
    code: JetBrains Mono
  
  # Features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss

  icon:
    repo: fontawesome/brands/github

# Custom CSS
extra_css:
  - stylesheets/extra.css

# JavaScript
extra_javascript:
  - javascripts/extra.js

# Plugins configuration
plugins:
  - search:
      separator: '[\s\-\_\.]+'
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: numpy
            merge_init_into_class: true
            show_if_no_docstring: false
            show_signature_annotations: true
            show_bases: true
            heading_level: 2
  # Exclude includes directory from navigation warnings
  - exclude:
      glob:
        - includes/*

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Page tree
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Performance & Lazy Loading: getting-started/performance.md
  - User Guide:
      - CLI Reference: guide/cli.md
      - Python API: guide/python-api.md
      - Web Interface: guide/web-interface.md
      - Storage Backends: guide/backends.md
      - Password Rotation: guide/rotation.md
      - Migration Guide: guide/migration.md
  - Examples:
      - Basic Usage: examples/basic.md
      - SQLAlchemy: examples/sqlalchemy.md
      - Pandas: examples/pandas.md
      - Async Support: examples/async.md
      - Marimo Notebooks: examples/marimo.md
  - Security:
      - Backend Security: security/backends.md
      - Best Practices: security/best-practices.md
      - Rotation & External Stores: security/rotation-and-external-stores.md
  - API Reference:
      - Core: api/core.md
      - Backends: api/backends.md
      - CLI: api/cli.md
      - Web: api/web.md

# Extra configuration
extra:
  # Remove mike versioning to fix versions.json warning
  # Add it back only when you actually use mike for versioning
  # version:
  #   provider: mike
  #   default: latest
  
  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sunnova-ShakesDlamini
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dbcreds/
  
  # Analytics (optional)
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    
  # Homepage
  homepage: https://sunnova-shakesdlamini.github.io/dbcreds/
